<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Corgi Command Pad</title>
    <style>
      :root {
        --bg: #fffaf5;
        --panel: #ffffff;
        --primary: #ff8b5e;
        --primary-dark: #ea6c3b;
        --accent: #b4e2f0;
        --text: #1f1f1f;
        --muted: #666;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: linear-gradient(180deg, #fffaf5, #fff);
        font-family: Arial, sans-serif;
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 16px;
      }

      .phone {
        width: min(100%, 440px);
        min-height: 100vh;
        background: var(--bg);
        border-radius: 28px;
        padding: 18px;
        box-shadow: 0 18px 42px rgba(0,0,0,0.08);
      }

      .photo-box {
        width: 100%;
        height: 380px;
        border-radius: 24px;
        overflow: hidden;
        background-image: url("https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=900&q=80");
        background-size: cover;
        background-position: center;
        border: 4px solid #fff;
        box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      }

      .command-wrap {
        margin-top: 18px;
      }

      .big-btn {
        width: 100%;
        height: 110px;
        border: none;
        border-radius: 26px;
        background: linear-gradient(135deg, var(--primary), #ffbc94);
        color: white;
        font-size: clamp(2.2rem, 7vw, 3.4rem);
        font-weight: 900;
        letter-spacing: 1px;
        box-shadow: 0 18px 28px rgba(255, 139, 94, 0.28);
        margin-bottom: 16px;
        cursor: pointer;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .small-btn {
        height: 88px;
        border: none;
        border-radius: 20px;
        background: #f3f4f6;
        font-size: clamp(1.6rem, 5vw, 2.2rem);
        font-weight: 800;
        color: var(--text);
        cursor: pointer;
      }

      .small-btn.active {
        background: linear-gradient(135deg, var(--accent), #dff5ff);
        box-shadow: inset 0 0 0 3px rgba(25, 110, 145, 0.12);
      }

      .status {
        margin-top: 16px;
        text-align: center;
        font-size: 1rem;
        font-weight: 700;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="photo-box" id="photoBox"></div>

      <div class="command-wrap">
        <button class="big-btn" id="mainBtn">SIT</button>

        <div class="grid">
          <button class="small-btn active" data-word="SIT">SIT</button>
          <button class="small-btn" data-word="STAY">STAY</button>
          <button class="small-btn" data-word="COME">COME</button>
          <button class="small-btn" data-word="TREAT">TREAT</button>
          <button class="small-btn" data-word="PLAY">PLAY</button>
          <button class="small-btn" data-word="WALK">WALK</button>
        </div>

        <div class="status" id="statusText">Ready</div>
      </div>
    </div>

    <script>
      const mainBtn = document.getElementById("mainBtn");
      const statusText = document.getElementById("statusText");
      const buttons = document.querySelectorAll(".small-btn");

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const word = button.dataset.word;
          mainBtn.textContent = word;
          statusText.textContent = "Command: " + word;

          buttons.forEach((b) => b.classList.toggle("active", b === button));
        });
      });

      mainBtn.addEventListener("click", () => {
        statusText.textContent = "Sent: " + mainBtn.textContent;
      });
    </script>
  </body>
</html>
